[Input]
; 0 = left, 1 = right. Xbox 360 uses the system XInput runtime.
ControllerIndex=0
CameraStick=1
Deadzone=0.22
InvertX=0
InvertY=0

[Garage]
Enabled=1
; Share the active Controls editor's inversion/deadzone, even if race orbit is OFF.
; Set either to 0 to use that garage setting from [Input] instead.
UseDrivingInversion=1
UseDrivingDeadzone=1
; 0 also remaps other garage screens when native rotation is allowed; 1 = parts only.
PartsOnly=0
PreviewDriver=1
RotationSpeed=1.0
; Controller zoom is separate from stick rotation and native mouse-wheel zoom.
ControllerZoom=1
; 0 preserves native mapped zoom. 1 replaces only controller zoom with the
; following physical XInput buttons, allowing LB/RB to remain menu actions.
OverrideZoomButtons=0
; XInput button masks: LB=0x100, RB=0x200; LT=0x10000, RT=0x20000.
; 0 disables that direction. Trigger pressure is analog above its deadzone.
ZoomInButton=0x10000
ZoomOutButton=0x20000
ZoomSpeed=1.0

; Driving orbit is configured with F7 in the game's controller options screen.
; It follows active native key settings through the controls save extension.

[ControlsEditor]
; Opt-in live tuning outside the native Controls screen. Requires an active profile.
AllowOutsideControls=0
; Windows virtual key: 118 = F7. Applies to the Controls screen shortcut too.
Hotkey=118

[RaceOrbit]
; Rate mode: native remapped look-back resets orbit while held.
; Direction mode composes with native look-back instead.
ResetOnLookBack=1
; Rate mode: POV/anchor/lag changes center orbit; release the stick before resuming.
ResetOnViewChange=1
; POV bits with a fixed eye position: bumper bit 0 + hood bit 1 = 3.
; A cockpit replacement using another POV can add that bit.
FixedEyePovMask=3

[StanceMenu]
; Use installed Showcase camera metadata inside the editor, without leaving its preview.
; Requires [Garage] Enabled=1 and PartsOnly=0. Set 0 to retain the usual menu camera.
OrbitCamera=1
; Multipliers of the companion's per-channel/per-car Step values.
; Xbox: hold X=fine, L3=fast. Start opens reset. Mouse fine prompt toggles;
; any controller activity reclaims held-button semantics. 0 disables a binding.
FineButton=0x4000
FastButton=0x40
ResetButton=0x10
; Windows virtual keys: Shift=16, Ctrl=17, Delete=46.
FineKey=16
FastKey=17
ResetKey=46
StepMultiplier=5
FineStepMultiplier=1
FastStepMultiplier=20
