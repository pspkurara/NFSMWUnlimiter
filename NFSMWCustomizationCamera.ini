[Input]
; 0 = left, 1 = right. Xbox 360 uses the system XInput runtime.
ControllerIndex=0
CameraStick=1
Deadzone=0.22
InvertX=0
InvertY=0

[Garage]
Enabled=1
PreviewDriver=1
RotationSpeed=1.0

; Driving orbit is configured with F7 in the game's controller options screen.
; It follows active native key settings through the controls save extension.

[ControlsEditor]
; Opt-in live tuning outside the native Controls screen. Requires an active profile.
AllowOutsideControls=0
; Windows virtual key: 118 = F7. Applies to the Controls screen shortcut too.
Hotkey=118

[RaceOrbit]
; Native remapped look-back resets orbit and owns the view while held.
ResetOnLookBack=1
